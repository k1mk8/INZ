version: '3.7'
services:
  db:
    container_name: inz23_db
    image: postgres:15.4-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db:/var/lib/postgresql/data

  api:
    container_name: inz23_api
    build:
      context: .
      dockerfile: src/main/java/inz23/stolmel/Dockerfile
    image: inz-api:latest
    ports:
      - "8082:8080"
    depends_on:
      - db
    restart: always

  app:
    container_name: inz23_app
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prod
    image: inz-app:latest
    restart: always
    # expose internal port 80 to other docker containers (nie musisz mapować na host jeśli używasz NPM w tej samej sieci)
    expose:
      - "80"
    networks:
      - npm_proxy_net

volumes:
  db:
    driver: local

networks:
  npm_proxy_net:
    external: true
